[project]
name = "snowglobe"
version = "0.1.0"
description = "Governed Snowflake results for humans, outside AI agent context"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Curtis Alexander" }]
dependencies = [
  "cryptography>=50.0,<51",
  "mcp>=2.0,<3",
  "pyarrow>=25.0.1,<26",
  "pydantic>=2.13.4,<3",
  "sqlglot>=30.17,<31",
  "starlette>=1.6,<2",
  "uvicorn>=0.52.4,<1",
]

[project.scripts]
snowglobe = "snowglobe.cli:main"
snowglobe-local = "snowglobe.local_server:main"
snowglobe-preflight = "snowglobe.preflight:main"

[project.optional-dependencies]
snowflake = [
  "snowflake-connector-python>=4.7.2,<5",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "httpx2>=2.12,<3",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16.4,<1",
  "ty>=0.0.73,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowglobe"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
include = ["src", "tests"]
